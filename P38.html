<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let playerscore = 0;
        let computerScore = 0;

        function game() {

            let gameOn = true;
            while (gameOn) {

                let m = Math.floor((Math.random() * 3) + 1);
                let u = Number(prompt(`
                 Enter 1 for Rock 
                 Enter 2 for Paper
                 Enter 3 for Scissor
                `));

                if (u <= 3) { winningPatter(u, m); }
                else { console.log("Enter valid Number only"); }
                if ((playerscore + computerScore) === 5) { break; }
            }

            ResultDisplay(playerscore, computerScore);
        }



        function winningPatter(u, m) {
            if (u === m) { console.log("Tie"); }
            else if (u === 1 && m === 3) { console.log("Rocks Win"); playerscore++; }
            else if (u === 3 && m === 1) { console.log("Rocks Win"); computerScore++; }
            else if (u === 2 && m === 1) { console.log("Paper wins"); playerscore++; }
            else if (u === 1 && m === 2) { console.log("Paper wins"); computerScore++; }
            else if (u === 3 && m === 2) { console.log("Scissor Wins"); playerscore++; }
            else if (u === 2 && m === 3) { console.log("Scissor Wins"); computerScore++; }

        }



        function ResultDisplay(p, c) {
            if (p > c) {
                console.log(`
                                Winner is Player
                                Playscore : ${p}
                                ComputerScore : ${c}`)
            }
            else if (p < c) {
                console.log(`
                                Winner is Computer
                                Playscore : ${p}
                                ComputerScore : ${c}`)
            }
        }


     game();

    </script>
</body>

</html>
