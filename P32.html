<body>
    <script>

        function Palidromechecker(s,arr) {
            let isPalidrome = false;
            reverseString = s.split('').reverse('').join('');
            if (s === reverseString) {
                isPalidrome = true;
            }

            if (s.length > 1) {
                if (isPalidrome) { 
                    arr.push(s);
                }
            }
        }

        function subStringsMaker(substr) {

            const SetArr =[];
            for (let i = 0; i < substr.length; i++) {
                for (let j = i+1; j < substr.length; j++) {
                    let substringSet = substr.slice(i, j+1);

                    Palidromechecker(substringSet, SetArr);
                }
            }
            console.log(SetArr);
        }



        subStringsMaker("radar");


    </script>
