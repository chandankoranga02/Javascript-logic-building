    <script>


         let arr = [2, 3, 5, 6, 4 , 8];

        function avgcalculator(a) {

                let summation = 0;

                for (let i = 0; i < a.length; i++) {

                    summation = summation + a[i];

                }

                let avg =  summation / a.length;
                console.log("The summation of an array :", avg)

                return summation;

        }



        avgcalculator(arr);
