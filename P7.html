<body>
    <script>
        // Make algorithim to check Leap year  , Concept - Every fourth Year is leap Year.



        let year = prompt("Enter a year");

        function leapyear(year) {

            if (Number(year)) {
                if (year % 4 === 0) {
                    console.log("Yes , This is Leap year ");
                }
                else {
                    console.log("This is not leap year");
                }
            }

            else {
                console.log("Enter a valid Number , Numerical format only");
            }
        }

        leapyear(year);




    </script>
</body>
