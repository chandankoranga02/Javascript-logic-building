<body>
    <script>

        function swapping(x , y) {

            console.log("Before Swapping : x =", x ,"y =", y );

            let temp;
            temp = x;
            x = y;
            y = temp;

            console.log("After Swapping : x =", x ,"y =", y );

        }

        swapping(5, 10);

        // Ek temporary varibale banaya humne Phele,
        // Fir usmain x ki value store karaee, 
        // Fir jo X tha usmian Y ki value store karaya
        // Fir jab Y varibale khali huaa toh usmain humne temp variable ki value store karae

    </script>
</body>
</html>
