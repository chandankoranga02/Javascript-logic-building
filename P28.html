<body>
    <script>

    let number = prompt("Enter a number to continue");

    function perfectNumberchecker(n) {
        let sum =0;

        for (let i = 1; i < n; i++) {
            if (n % i === 0) {
                console.log("The divisor  is : ", i);
                sum = sum + i;
            }
        }
        console.log("The sum of the number is :", sum);

        if (n === sum) {
            console.log(`Hey congratulation ${sum} is perfect number`);
        }

        else{
            console.log("Sorry not Perfect Number , Try next ");
        }

        return sum;

    }

    perfectNumberchecker(Number(number));

    </script>
</body>
</html>
