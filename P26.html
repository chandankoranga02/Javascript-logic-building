    <script>

        let stringone = prompt("Enter word one ");
        let stringtwo = prompt("Enter word two ");

        function anagramchecker(a, b) {

            let count = 0;

            for (let i = 0; i < a.length; i++) {

                for (let j = 0; j < b.length; j++) {

                    if (a[i] === b[j]) {
                        count++;
                    }
                }
            }

            if (count === b.length && count === a.length) {
                console.log("Boths strings are anagram");
            }

            else {
                console.log("Both string are not anagram");
            }

            return count;

        }

        anagramchecker(stringone, stringtwo);

        // JS recommended method

        function anagram(a, b) {

            if (a.length === b.length) {

                let achar = {};
                for (let char of a) {
                    if (!achar[char]) {
                        achar[char] = 0;          // Dekho jab yahan pe condition follow huee , toh object ke andar character ban gaye aur unki vlaue zero pe initiliaze hogaye 
                    }
                    achar[char]++;                // Suppose ab jab ek baar vo character dubra repeat hunge toh , toh unki value bad jayegi jitne baad vo present hunge
                }

                let bchar = {};
                for (let char of b) {
                    if (!bchar[char]) {
                        bchar[char] = 0;
                    }
                    bchar[char]++;
                }
                console.log(achar);
                console.log(bchar);

                for (let key in achar) {
                    if (achar[key] !== bchar[key]) {
                        console.log("Both the strings are not anagram");
                        return false;
                    }
                }
                console.log("Both the strings are anagram");
                return true;




            }
            else {
                console.log("Both strings are not anagram");
            }
        }


        anagram(stringone, stringtwo);
