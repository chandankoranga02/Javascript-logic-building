    <script>

        let number = prompt("Enter a number to continue ");

        function fizbuz(n) {

            let store =[];
            for (let i = 1; i < n+1; i++) {

                if(i % 15 === 0){
                    store.push("FizzBuzz");
                }

               else if (i % 3 === 0) {
                    store.push("Fizz");
                }

                else if (i % 5 === 0) {
                    store.push("Buzz");
                }

                else {
                    store.push(i);
                }
                
            }

            console.log(store);
        }

        fizbuz(Number(number));

    </script>
