<body>
    <script>

        let value = prompt("Enter the value , for which you want to print vowels and consonents");

        function vowelscounter(v) {

            let count = 0;
            let vowels = ['a', 'e', 'i', 'u', 'o'];
            for (let i = 0; i < v.length; i++) {
                if (vowels.includes(v[i])) {
                    count++;
                }
            }
            console.log("we have total vowels: ", count);
            return count;

        }
        
        function consonentscounter(c) {
            let count = 0;
            let vowels = ['a', 'e', 'i', 'u', 'o'];
            for (let i = 0; i < c.length; i++) {

                if (!vowels.includes(c[i])) {
                    count++;
                }
            }
            console.log("we have total consonents: ", count);
            return count;

        }

        vowelscounter(value);
        consonentscounter(value);

// vowels.includes(v[i]) ka matlab:

    </script>
